# Tailnet-only HTTPS entrypoint. Binds only to this node's Tailscale addresses,
# so it is unreachable from the public interface.
server {
    listen 100.113.18.9:443 ssl;
    listen [fd7a:115c:a1e0::f52c:120a]:443 ssl;
    http2 on;
    server_name <host>.<tailnet>.ts.net;

    ssl_certificate     /etc/nginx/tls/vps.crt;
    ssl_certificate_key /etc/nginx/tls/vps.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
    }

    # Internal services get their own location blocks here.

    location / {
        return 404;
    }
}
