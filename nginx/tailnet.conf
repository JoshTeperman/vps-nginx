# Routing layer behind `tailscale serve`.
#
#   tailnet --HTTPS--> tailscaled (:443, TLS terminated) --HTTP--> nginx 127.0.0.1:8080 --> services
#
# nginx listens only on loopback; tailscaled is the only tailnet-facing listener.
# Each tailnet HTTPS port served by tailscale gets its own `server` block here
# (see scripts/install.sh for the port mapping).

# tailscaled is the only thing that can reach these listeners, so trust the
# client IP it reports. $remote_addr then becomes the caller's tailnet IP,
# which `allow`/`deny` rules and logs see.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   X-Forwarded-For;

# Tailnet :443 -> https://<host>.<tailnet>.ts.net
server {
    listen 127.0.0.1:8080;
    server_name <host>.<tailnet>.ts.net;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Tailscale-User-Login / -Name headers from tailscaled pass through unchanged.

    location = /health {
        proxy_pass http://127.0.0.1:8081;
    }

    # Internal services get their own location blocks here, e.g.:
    # location /app/ { proxy_pass http://127.0.0.1:3000/; }

    location / {
        return 404;
    }
}
