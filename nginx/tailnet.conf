set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header   X-Forwarded-For;

log_format github_token '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent $request_time';

server {
    listen 127.0.0.1:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /health {
        proxy_pass http://127.0.0.1:8081;
    }

    # vault-search MCP (Streamable HTTP). Headers are repeated here because a
    # location that sets any proxy_set_header inherits none from the server.
    location /vault/mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /github-token/ {
        proxy_pass http://127.0.0.1:8740;
        client_max_body_size 64k;
        access_log /var/log/nginx/github-token.access.log github_token;
    }

    location / {
        return 404;
    }
}
